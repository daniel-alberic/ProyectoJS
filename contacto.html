    <title>Document</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <h1><span class="logo-text">CONTACTO</span></h1>
                <div class="logo-underline"></div>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">PORTFOLIO</a></li>
                    <li><a href="#">STORE</a></li>
                    <li><a href="#">BLOG</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
            </nav>
        </header>

        <main class="main-content">
            <p class="description">Interested in working together? Fill out the form below with some info about your project and I will get back to you as soon as I can. Please allow a couple days for me to respond.</p>

            <form  action="php/enviar.php" method="POST" class="contact-form" id="contact-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">*Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" name="name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">*Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Tell me a little about your project:</label>
                    <div class="textarea-wrapper">
                        <i class="fas fa-pencil-alt"></i>
                        <textarea id="message" name="message" rows="8"></textarea>
                    </div>
                </div>

                <button type="submit">Send</button>
            </form>

            <div><img src="img/peggy_marco-meet-1019875_1280.jpg" alt=""></div>
        </main>
    </div>

    <link rel="stylesheet" href="CSS/styles.css">
